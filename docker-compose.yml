# ============================================================
# docker-compose.yml - 多服务编排
#
# 快速启动:
#   docker-compose up -d              # 仅 Streamlit (ChromaDB 嵌入模式)
#   docker-compose --profile full up -d   # 包含 Nginx 反代
# ============================================================

version: "3.9"

services:
  # ---- Streamlit 应用 ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paper-analyzer
    ports:
      - "8501:8501"
    environment:
      # LLM 提供商 (deepseek | openai)
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      # API Key (优先使用环境变量，也可由用户在 UI 侧边栏输入)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 模型配置
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # 日志
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # 持久化数据 (ChromaDB 嵌入模式)
      - paper_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- Nginx 反向代理 (可选) ----
  nginx:
    image: nginx:alpine
    container_name: paper-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - full

# ---- 数据卷 ----
volumes:
  paper_data:
    name: paper_analyzer_data
