# ============================================================
# Nginx 反向代理配置
# 使用: docker-compose --profile full up -d
# 将 80/443 端口请求转发到 Streamlit (8501)
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # 上传大小限制 (PDF)
    client_max_body_size 50m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;

    # ---- Streamlit 反向代理 ----
    server {
        listen 80;
        server_name _;

        # Streamlit 需要 WebSocket 支持
        location / {
            proxy_pass http://app:8501;

            # WebSocket 支持 (Streamlit 必须)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 标准代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时 (Agent 调用可能较慢)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Streamlit 静态资源
        location /_stcore/ {
            proxy_pass http://app:8501/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ---- HTTPS (取消注释并配置 SSL 证书) ----
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     location / {
    #         proxy_pass http://app:8501;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 300s;
    #     }
    # }
}
